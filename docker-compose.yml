version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: restaurant_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: restaurant_user
      MYSQL_PASSWORD: restaurant_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
      - mysql_data:/var/lib/mysql
    networks:
      - restaurant_network

  backend:
    build: ./backend
    container_name: restaurant_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://restaurant_user:restaurant_password@mysql:3306/restaurant_db
      SECRET_KEY: votre_cle_secrete_tres_longue_et_aleatoire_12345
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
    networks:
      - restaurant_network

  frontend:
    build: ./frontend
    container_name: restaurant_frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - restaurant_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: restaurant_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - restaurant_network

volumes:
  mysql_data:

networks:
  restaurant_network:
    driver: bridge